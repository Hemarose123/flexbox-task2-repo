<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Task Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 20px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    
    .top-row {
      display: flex;
      gap: 10px;
    }
    .top-box {
      flex: 1;
      background-color: #ec9898;
      height: 60px;
    }

    
    .content-section {
      display: flex;
      gap: 10px;
      height: 300px;
    }

    .left-section {
      flex: 2;
      background-color: #7cab7c;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .left-section .yellow-box {
      width: 50px;
      height: 50px;
      background-color: yellow;
    }

    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .right-box {
      flex: 1;
      background-color: #a9cb76;
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="top-row">
    <div class="top-box"></div>
    <div class="top-box"></div>
    <div class="top-box"></div>
  </div>

  <div class="content-section">
    <div class="left-section">
      <div class="yellow-box"></div>
    </div>
    <div class="right-section">
      <div class="right-box"></div>
      <div class="right-box"></div>
      <div class="right-box"></div>
    </div>
  </div>
</div>

</body>
</html>
